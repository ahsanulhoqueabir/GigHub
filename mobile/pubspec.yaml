name: gighub
description: "GigHub - Freelance Marketplace Mobile App"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Routing
  go_router: ^14.8.0

  # Networking
  dio: ^5.7.0

  # Storage
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.3

  # Serialization
  json_annotation: ^4.9.0
  freezed_annotation: ^2.4.4

  # Firebase
  firebase_core: ^3.12.0
  firebase_auth: ^5.5.0
  firebase_messaging: ^15.2.4
  google_sign_in: ^6.2.2

  # Notifications
  flutter_local_notifications: ^18.0.1

  # Media
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1

  # UI
  shimmer: ^3.0.0
  flutter_svg: ^2.0.17

  # Utils
  intl: ^0.19.0
  url_launcher: ^6.3.1
  path_provider: ^2.1.5
  connectivity_plus: ^6.1.4

  # WebSocket (Phase 4)
  # socket_io_client: ^3.0.2

  # Payment WebView (Phase 3)
  # webview_flutter: ^4.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

  # App branding
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.4

  # Code Generation
  build_runner: ^2.4.15
  json_serializable: ^6.9.4
  freezed: ^2.5.8
  riverpod_generator: ^2.6.4

  # Testing
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

  assets:
    - assets/splashlogo.png
    - assets/images/
    - assets/icons/
    - assets/fonts/

flutter_launcher_icons:
  image_path: assets/images/logo.png
  android: true
  ios: true
  web:
    generate: true
    image_path: assets/images/logo.png
  windows:
    generate: true
    image_path: assets/images/logo.png
  macos:
    generate: true
    image_path: assets/images/logo.png
  linux:
    generate: true
    image_path: assets/images/logo.png

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/splashlogo.png
  android: true
  ios: true
  web: true
  android_12:
    color: "#FFFFFF"
    image: assets/splashlogo.png
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
